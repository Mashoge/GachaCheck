# Runs the event collector on a schedule and sends what it finds to the ingest function.
#
# Needs one repository secret: INGEST_SECRET (Settings > Secrets and variables > Actions).
# The ingest URL is public, so it lives here in plain text.
#
# A failed run (site unreachable, a changed page format, a rejected payload) shows as a red X
# in the Actions tab, and GitHub emails the repository owner.

name: Collect events

on:
  schedule:
    # Times are UTC. 03:17 and 15:17 UTC = 11:17 AM and 11:17 PM in Manila.
    # WuWa posts Patch Notes around 10:00 AM UTC+8 on update day, so the morning run catches them.
    # Off the hour on purpose: GitHub delays runs scheduled at :00 the most.
    - cron: '17 3,15 * * *'
  workflow_dispatch:        # a "Run workflow" button in the Actions tab, for manual runs
    inputs:
      dry_run:
        description: 'Dry run (send, but save nothing)'
        type: boolean
        default: false

permissions:
  contents: read            # read the code; nothing else

concurrency:
  group: collect-events     # never two runs at once
  cancel-in-progress: false

jobs:
  wuwa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: collector/pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest -q

      - name: Collect and send
        env:
          INGEST_URL: https://tapgczqdcrslcnwjvkxd.supabase.co/functions/v1/ingest
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
        run: python -m gachacheck_collector wuwa ${{ inputs.dry_run && '--dry-run' || '' }}
