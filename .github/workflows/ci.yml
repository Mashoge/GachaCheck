name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check PWA assets
        run: npm run check:pwa

      - name: Lint
        run: npm run lint

      - name: Run tests
        env:
          # today.test.ts imports the Supabase client through today.ts, but these
          # tests only exercise pure calculations and never make network requests.
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key-for-tests-only
        run: npm test

      - name: Build production app
        run: npm run build

  collector:
    name: Collector tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: collector
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # Same Python and install as the scheduled collect job, so a change that breaks the
      # collector shows up on push instead of at the next 11:17 run.
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: collector/pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Run tests (no network, nothing is sent)
        run: python -m pytest -q
